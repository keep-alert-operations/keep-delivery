<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">How Appchi concepts connect</title><desc id="desc">A tenant contains alerts, incidents, presets and dashboards. Incidents coordinate related alerts. Presets select alerts and dashboards count the selections. Suppression excludes alerts from ordinary views without deleting them.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#56736f" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="500" rx="24" fill="#f3f5f1"/>
<g font-family="Arial, sans-serif" fill="#193c37"><text x="38" y="47" font-size="25" font-weight="bold">One tenant · shared data and access</text><text x="38" y="78" font-size="18">Start by choosing the workspace you intend to investigate.</text></g>
<g fill="white" stroke="#bccfc8" stroke-width="2"><rect x="38" y="135" width="240" height="140" rx="15"/><rect x="425" y="135" width="250" height="140" rx="15"/><rect x="820" y="135" width="240" height="140" rx="15"/><rect x="38" y="344" width="240" height="116" rx="15"/></g>
<g font-family="Arial, sans-serif" fill="#193c37" font-size="19"><text x="62" y="175" font-size="26" font-weight="bold">Alerts</text><text x="62" y="211">A continuing record</text><text x="62" y="240">of each condition</text><text x="450" y="175" font-size="26" font-weight="bold">Presets</text><text x="450" y="211">Saved query, columns</text><text x="450" y="240">and sorting</text><text x="844" y="175" font-size="26" font-weight="bold">Dashboards</text><text x="844" y="211">Counts from current</text><text x="844" y="240">saved preset queries</text><text x="62" y="385" font-size="26" font-weight="bold">Incidents</text><text x="62" y="421">Coordinate related work</text></g>
<g stroke="#56736f" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 202H411"/><path d="M687 202H806"/><path d="M158 334V287"/></g>
<g font-family="Arial, sans-serif" fill="#46675e" font-size="18" text-anchor="middle"><text x="350" y="183">select</text><text x="746" y="183">count</text><text x="227" y="316">link</text></g>
<rect x="425" y="344" width="635" height="116" rx="15" fill="#fff1d3"/>
<g font-family="Arial, sans-serif" fill="#765215"><text x="450" y="383" font-size="24" font-weight="bold">Suppression changes ordinary visibility</text><text x="450" y="416" font-size="19">Alerts remain stored. Use Include suppressed to inspect them.</text><text x="450" y="443" font-size="19">Existing incident links remain; dashboard counts exclude them.</text></g></svg>
