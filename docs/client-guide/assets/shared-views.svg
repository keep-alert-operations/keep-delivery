<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Temporary exploration and shared views</title><desc id="desc">Text search, quick views, suppression switches and results-toolbar grouping changes stay temporary. Explicit Save stores the preset name, CEL, columns, sort and optional grouping. Dashboard panels use the current saved CEL and exclude suppression.</desc>
<rect width="1100" height="430" rx="24" fill="#f3f5f1"/>
<g font-family="Arial, sans-serif" fill="#193c37"><text x="35" y="48" font-size="27" font-weight="bold">Explore locally. Save deliberately.</text><text x="35" y="80" font-size="19">Shared definitions affect other people in the tenant.</text></g>
<g fill="white" stroke="#bccfc8" stroke-width="2"><rect x="35" y="112" width="320" height="225" rx="15"/><rect x="390" y="112" width="320" height="225" rx="15"/><rect x="745" y="112" width="320" height="225" rx="15"/></g>
<g font-family="Arial, sans-serif" fill="#193c37" font-size="19"><text x="58" y="150" font-size="24" font-weight="bold">Temporary choices</text><text x="58" y="186">Search text</text><text x="58" y="216">Quick views</text><text x="58" y="246">Include suppressed</text><text x="58" y="276">Toolbar grouping change</text><text x="58" y="314" fill="#56736f">Not saved with a preset</text><text x="413" y="150" font-size="24" font-weight="bold">Saved preset</text><text x="413" y="186">Name and CEL query</text><text x="413" y="216">Selected columns</text><text x="413" y="246">Sort order</text><text x="413" y="276">Optional grouping</text><text x="413" y="314" fill="#56736f">Explicit Save required</text><text x="768" y="150" font-size="24" font-weight="bold">Dashboard panel</text><text x="768" y="186">References a saved preset</text><text x="768" y="216">Counts current query matches</text><text x="768" y="246">Excludes suppressed alerts</text><text x="768" y="314" fill="#56736f">Open to investigate its results</text></g>
<text x="35" y="388" font-family="Arial, sans-serif" font-size="20" fill="#193c37">Saving new CEL changes counts in every panel that references that preset.</text></svg>
