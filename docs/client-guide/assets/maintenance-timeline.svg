<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
<title id="title">Maintenance ending and suppression clearing are different moments</title><desc id="desc">A window runs from 10 to 11. A qualifying alert at 10:15 becomes suppressed. At 11 the window ends but suppression remains. A source update received at 11:10 can close this cause. Other causes may still keep the alert suppressed.</desc>
<rect width="1100" height="450" rx="24" fill="#f3f5f1"/>
<g font-family="Arial, sans-serif" fill="#193c37"><text x="35" y="48" font-size="27" font-weight="bold">Ended does not mean released</text><text x="35" y="81" font-size="19">Illustrative one-time window: 10:00–11:00</text></g>
<rect x="85" y="119" width="620" height="48" rx="10" fill="#d9e9df"/><text x="110" y="150" font-family="Arial, sans-serif" fill="#193c37" font-size="21">Window accepts qualifying coverage</text>
<path d="M85 204H1010" stroke="#56736f" stroke-width="3"/>
<g fill="#257669"><circle cx="85" cy="204" r="7"/><circle cx="260" cy="204" r="7"/><circle cx="705" cy="204" r="7"/><circle cx="980" cy="204" r="7"/></g>
<g font-family="Arial, sans-serif" fill="#193c37" font-size="21" text-anchor="middle"><text x="85" y="242">10:00</text><text x="260" y="242">10:15</text><text x="705" y="242">11:00</text><text x="980" y="242">11:10</text></g>
<path d="M260 268H980" stroke="#d5a039" stroke-width="14"/>
<g font-family="Arial, sans-serif" fill="#765215" font-size="19"><text x="285" y="304">This maintenance cause remains open until a later source update.</text></g>
<g font-family="Arial, sans-serif" fill="#193c37" font-size="18"><text x="36" y="351">Window starts</text><text x="211" y="351">Qualifying alert</text><text x="211" y="379">is suppressed</text><text x="642" y="351">Window ends</text><text x="642" y="379">No timer release</text><text x="866" y="351">Source update</text><text x="866" y="379">can close this cause</text></g>
<text x="35" y="425" font-family="Arial, sans-serif" fill="#193c37" font-size="19">Other maintenance or source-suspension causes can still keep the alert suppressed.</text></svg>
