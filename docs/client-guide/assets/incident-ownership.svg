<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">One active incident owner per alert</title><desc id="desc">A resolved incident may retain a historical link to an alert while an active incident owns its current membership. Resolving the incident does not resolve the alert, and assigning the incident does not assign the alert.</desc>
<rect width="1100" height="420" rx="24" fill="#f3f5f1"/>
<g font-family="Arial, sans-serif" fill="#193c37"><text x="35" y="48" font-size="27" font-weight="bold">One alert, one active incident owner</text><text x="35" y="82" font-size="19">Historical relationships can remain after an earlier incident is resolved.</text></g>
<g fill="white" stroke="#bccfc8" stroke-width="2"><rect x="35" y="130" width="285" height="145" rx="15"/><rect x="420" y="130" width="260" height="145" rx="15"/><rect x="780" y="130" width="285" height="145" rx="15"/></g>
<path d="M320 202H420" stroke="#78918c" stroke-width="3" stroke-dasharray="8 6"/><path d="M680 202H780" stroke="#257669" stroke-width="5"/>
<g font-family="Arial, sans-serif" fill="#193c37" font-size="19"><text x="58" y="170" font-size="25" font-weight="bold">Earlier incident</text><text x="58" y="207">Resolved</text><text x="58" y="245">Historical link retained</text><text x="445" y="170" font-size="25" font-weight="bold">Alert</text><text x="445" y="207">Own status</text><text x="445" y="245">Own assignee</text><text x="803" y="170" font-size="25" font-weight="bold">Current incident</text><text x="803" y="207">Open or Investigating</text><text x="803" y="245">Active membership</text></g>
<rect x="35" y="307" width="1030" height="78" rx="14" fill="#fff1d3"/>
<g font-family="Arial, sans-serif" fill="#765215" font-size="20"><text x="57" y="339">Resolving the incident does not resolve its alerts.</text><text x="57" y="369">Assigning the incident does not assign its alerts. Check both before handoff.</text></g></svg>
