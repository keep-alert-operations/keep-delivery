[project]
name = "appchi-delivery"
version = "0.1.0"
description = "Workspace setup, local dependencies, deployments, release inventory and system verification."
requires-python = ">=3.13,<3.14"
dependencies = [
  "appchi-api @ git+https://github.com/appchi-alert-operations/appchi-api.git@08bf1ecb364a4272030b1c2e139132ef1c58dccf",
  "appchi-ingestion @ git+https://github.com/appchi-alert-operations/appchi-ingestion.git@c019991b54a1a7d0979b2b578544663543df09bd",
  "appchi-processor @ git+https://github.com/appchi-alert-operations/appchi-processor.git@476320f591edd260f29647e242e980cde0c8b5bb",
  "appchi-correlation @ git+https://github.com/appchi-alert-operations/appchi-correlation.git@5cad5e313efd216d3fd445c75e0a0354fc9c7478",
  "appchi-indexer @ git+https://github.com/appchi-alert-operations/appchi-indexer.git@76396935379e6609b01986bb1ea403178c74685e",
  "appchi-migrations @ git+https://github.com/appchi-alert-operations/appchi-migrations.git@e34fdea836203b4e91b94ebe3c7db3cd590e1a34"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "hypothesis>=6.130,<7", "build>=1,<2", "poetry==2.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appchi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit", "tests/integration"]
markers = ["integration: requires isolated real services", "compatibility: requires configured external services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.poetry]
requires-poetry = "==2.3.1"
packages = [
  { include = "appchi", from = "src" },
]

# Resolve-only pins preserve the coordinated baseline without adding runtime requirements.
[tool.poetry.group.lock-constraints]
optional = true

