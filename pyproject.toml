[project]
name = "appchi-delivery"
version = "0.1.0"
description = "Workspace setup, local dependencies, deployments, release inventory and system verification."
requires-python = ">=3.13,<3.14"
dependencies = [
  "appchi-api @ git+https://github.com/appchi-alert-operations/appchi-api.git@c6c59f3ee5a2033324738f53aacb3352dd7ee75d",
  "appchi-ingestion @ git+https://github.com/appchi-alert-operations/appchi-ingestion.git@6cd08143c8ca3a8f962e43d2800eee6cf613f97a",
  "appchi-processor @ git+https://github.com/appchi-alert-operations/appchi-processor.git@b8e5802bb96ef637f1ffba0fc21fbb55d56b027b",
  "appchi-correlation @ git+https://github.com/appchi-alert-operations/appchi-correlation.git@d5357a7a253d25689ec3459a6a2e4951048af6f6",
  "appchi-indexer @ git+https://github.com/appchi-alert-operations/appchi-indexer.git@2ccb2226586ddd94e730456a7f33414beb35fe75",
  "appchi-migrations @ git+https://github.com/appchi-alert-operations/appchi-migrations.git@89ffdb07a7250ad67dd5458459c595566c22eaef"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "hypothesis>=6.130,<7", "build>=1,<2", "poetry==2.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appchi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit", "tests/integration"]
markers = ["integration: requires isolated real services", "compatibility: requires configured external services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.poetry]
requires-poetry = "==2.3.1"
packages = [
  { include = "appchi", from = "src" },
]

# Resolve-only pins preserve the coordinated baseline without adding runtime requirements.
[tool.poetry.group.lock-constraints]
optional = true

