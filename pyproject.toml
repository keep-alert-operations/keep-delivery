[project]
name = "keep-delivery"
version = "0.1.0"
description = "Workspace setup, local dependencies, deployments, release inventory and system verification."
requires-python = ">=3.13,<3.14"
dependencies = [
  "keep-api @ git+https://github.com/keep-alert-operations/keep-api.git@26d89c418b605c00b7c6cb7b6900f3d777664b6b",
  "keep-ingestion @ git+https://github.com/keep-alert-operations/keep-ingestion.git@18b6685714c42bfb03a157453fb55d2e2a13a582",
  "keep-processor @ git+https://github.com/keep-alert-operations/keep-processor.git@271a227897c07056146d91c75f54e652fe66fe45",
  "keep-correlation @ git+https://github.com/keep-alert-operations/keep-correlation.git@44605a01f1ed468d6894fc76e280ccbdff02ebd5",
  "keep-indexer @ git+https://github.com/keep-alert-operations/keep-indexer.git@fe9d2f9e7c5b88e98917cd6857377b962afeedd9",
  "keep-migrations @ git+https://github.com/keep-alert-operations/keep-migrations.git@eb5e10dca229876d2b2f91cc005fceadf4eb9c34"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "hypothesis>=6.130,<7", "build>=1,<2", "poetry==2.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit", "tests/integration"]
markers = ["integration: requires isolated real services", "compatibility: requires configured external services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.poetry]
requires-poetry = "==2.3.1"
packages = [
  { include = "keep", from = "src" },
]

# Resolve-only pins preserve the coordinated baseline without adding runtime requirements.
[tool.poetry.group.lock-constraints]
optional = true

