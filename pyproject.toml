[project]
name = "appchi-delivery"
version = "0.1.0"
description = "Workspace setup, local dependencies, deployments, release inventory and system verification."
requires-python = ">=3.13,<3.14"
dependencies = [
  "appchi-api @ git+https://github.com/appchi-alert-operations/appchi-api.git@0b8a1a351378d0a7952a405b6fac4db1d03c6096",
  "appchi-ingestion @ git+https://github.com/appchi-alert-operations/appchi-ingestion.git@0d2ee23a7940c2c0866498aa0646587f101651bc",
  "appchi-processor @ git+https://github.com/appchi-alert-operations/appchi-processor.git@4f7a3fc81483d193033c3eec9f54f6aaeb6a5392",
  "appchi-correlation @ git+https://github.com/appchi-alert-operations/appchi-correlation.git@ad68f9f4838848f5d318888be4b0e067d5b51e5b",
  "appchi-indexer @ git+https://github.com/appchi-alert-operations/appchi-indexer.git@ff88bec0e57e4fbcb3af7917e9bdbe29f5efbec3",
  "appchi-migrations @ git+https://github.com/appchi-alert-operations/appchi-migrations.git@6d5e0830ba9322423809015dcac4887d4f4f5b17"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "hypothesis>=6.130,<7", "build>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appchi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit", "tests/integration"]
markers = ["integration: requires isolated real services", "compatibility: requires configured external services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
constraint-dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "authlib==1.8.0",
  "cel-expr-python==0.1.3",
  "certifi==2026.7.22",
  "cffi==2.1.1",
  "click==8.5.0",
  "colorama==0.4.6",
  "confluent-kafka==2.15.1",
  "cryptography==46.0.7",
  "elastic-transport==9.4.2",
  "elasticsearch==9.5.1",
  "fastapi==0.141.1",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "hypothesis==6.168.0",
  "idna==3.20",
  "iniconfig==2.3.0",
