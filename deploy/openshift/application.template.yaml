{
  "apiVersion": "template.openshift.io/v1",
  "kind": "Template",
  "metadata": {
    "name": "keep-product-api",
    "annotations": {
      "description": "Product API owns synchronous operator provisioning and background live hint publishing. CONFIG_SECRET supplies KEEP_REDIS_URL and, optionally, KEEP_TICKET_COUNT_URL (REV-65 ServiceNow ticket counting service, https; may carry an access key), and, optionally, KEEP_GRAFANA_PANEL_ORIGINS (REV-68 Grafana that Grafana panels may frame: comma-separated https addresses with an optional base path; not a secret); apply migration 0047 for minimal hint-outbox publication privileges. No separate live worker or worker database credential is needed. CONFIG_SECRET supplies KEEP_OPERATOR_DATABASE_URL and operator management tokens; BINDING_SECRET supplies the verified operator binding. Qualify a 100-second operator-route gateway timeout; other routes retain their own budgets."
    }
  },
  "parameters": [
    {
      "name": "PRODUCT_API_IMAGE",
      "required": true
    },
    {
      "name": "CONFIG_SECRET",
      "required": true
    },
    {
      "name": "BINDING_SECRET",
      "required": true
    },
    {
      "name": "SERVICE_ACCOUNT",
      "required": true
    },
    {
      "name": "CPU_REQUEST",
      "required": true
    },
    {
      "name": "CPU_LIMIT",
      "required": true
    },
    {
      "name": "MEMORY_REQUEST",
      "required": true
    },
    {
      "name": "MEMORY_LIMIT",
      "required": true
    },
    {
      "name": "EPHEMERAL_STORAGE_REQUEST",
      "required": true
    },
    {
      "name": "EPHEMERAL_STORAGE_LIMIT",
      "required": true
    },
    {
      "name": "TMP_SIZE_LIMIT",
      "required": true
    },
    {
      "name": "REPLICAS",
      "required": true
    },
    {
      "name": "CLOCK_HEALTH_CONFIGMAP",
      "required": true
    }
  ],
  "objects": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "keep-product-api"
      },
      "spec": {
        "replicas": "${{REPLICAS}}",
        "selector": {
          "matchLabels": {
            "app": "keep-product-api"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "keep-product-api",
              "app.kubernetes.io/part-of": "keep"
            }
          },
          "spec": {
            "serviceAccountName": "${SERVICE_ACCOUNT}",
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 105,
            "containers": [
              {
                "name": "api",
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 8000
                  }
                ],
                "env": [
                  {
                    "name": "KEEP_ROLE",
                    "value": "product-api"
                  },
                  {
                    "name": "KEEP_CLOCK_HEALTH_FILE",
                    "value": "/run/keep-clock/health.json"
                  },
                  {
                    "name": "KEEP_DATABASE_CLOCK_HEALTH_FILE",
                    "value": "/run/keep-clock/pg-health.json"
                  }
                ],
                "livenessProbe": {
                  "httpGet": {
                    "path": "/livez",
                    "port": "http"
                  },
                  "timeoutSeconds": 5,
                  "periodSeconds": 10,
                  "failureThreshold": 3
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": "http"
                  },
                  "timeoutSeconds": 5,
                  "periodSeconds": 10,
                  "failureThreshold": 3
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/livez",
                    "port": "http"
                  },
                  "timeoutSeconds": 5,
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "image": "${PRODUCT_API_IMAGE}",
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "${CONFIG_SECRET}"
                    }
                  }
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "runAsNonRoot": true,
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  },
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "${CPU_REQUEST}",
                    "memory": "${MEMORY_REQUEST}",
                    "ephemeral-storage": "${EPHEMERAL_STORAGE_REQUEST}"
                  },
                  "limits": {
                    "cpu": "${CPU_LIMIT}",
                    "memory": "${MEMORY_LIMIT}",
                    "ephemeral-storage": "${EPHEMERAL_STORAGE_LIMIT}"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  },
                  {
                    "name": "bindings",
                    "mountPath": "/etc/keep",
                    "readOnly": true
                  },
                  {
                    "name": "clock-health",
                    "mountPath": "/run/keep-clock",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "tmp",
                "emptyDir": {
                  "sizeLimit": "${TMP_SIZE_LIMIT}"
                }
              },
              {
                "name": "bindings",
                "secret": {
                  "secretName": "${BINDING_SECRET}"
                }
              },
              {
                "name": "clock-health",
                "configMap": {
                  "name": "${CLOCK_HEALTH_CONFIGMAP}"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "keep-product-api"
      },
      "spec": {
        "selector": {
          "app": "keep-product-api"
        },
        "ports": [
          {
            "name": "http",
            "port": 8000,
            "targetPort": 8000
          }
        ]
      }
    }
  ]
}
