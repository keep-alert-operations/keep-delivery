# Hints are disposable. Do not use this server for application authority.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/redis-tls/tls.crt
tls-key-file /run/redis-tls/tls.key
tls-ca-cert-file /run/redis-tls/ca.crt
# Authentication uses the ACL below; clients still verify the server certificate.
tls-auth-clients no
aclfile /etc/redis/users.acl
save ""
appendonly no
dir /data
maxmemory 256mb
maxmemory-policy noeviction
loglevel notice
logfile ""
