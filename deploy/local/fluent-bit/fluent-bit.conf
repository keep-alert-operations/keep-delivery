# Keep log transport (REV-74, observability 6).
#
# Every Keep service posts its log records to this one Fluent Bit over HTTP, each to
# the path named for its service (/keep.processor, /keep.browser, ...). The path is
# the routing tag, so each service's records go to their own Elasticsearch index.
# Keep configures nothing in Elasticsearch: no templates, retention or roles.
#
# The logs cluster is set here (KEEP_LOGS_ELASTICSEARCH_HOST and _PORT) and is
# independent of the alert-search cluster the applications use
# (KEEP_ELASTICSEARCH_URL). They may be the same cluster or different ones.
# Index names are the `index` values below.

[SERVICE]
    flush                     1
    log_level                 info
    http_server               on
    http_listen               0.0.0.0
    http_port                 2020
    storage.path              /fluent-bit/storage
    storage.sync              normal
    storage.backlog.mem_limit 32M

[INPUT]
    name              http
    listen            0.0.0.0
    port              9880
    buffer_chunk_size 512K
    buffer_max_size   8M
    storage.type      filesystem

# The application's own @timestamp is the event time. Fluent Bit's receive time is
# written under another name, so the two never collide and their difference is the
# shipping delay. generate_id with the default create operation means a batch that
# is sent again cannot duplicate records.

[OUTPUT]
    name                     es
    match                    keep.ingestion
    host                     ${KEEP_LOGS_ELASTICSEARCH_HOST}
    port                     ${KEEP_LOGS_ELASTICSEARCH_PORT}
    index                    keep-logs-ingestion
    suppress_type_name       on
    generate_id              on
    time_key                 shipped_at
    trace_error              on
    buffer_size              1M
    retry_limit              10
    storage.total_limit_size 256M

[OUTPUT]
    name                     es
    match                    keep.processor
    host                     ${KEEP_LOGS_ELASTICSEARCH_HOST}
    port                     ${KEEP_LOGS_ELASTICSEARCH_PORT}
    index                    keep-logs-processor
    suppress_type_name       on
    generate_id              on
    time_key                 shipped_at
    trace_error              on
    buffer_size              1M
    retry_limit              10
    storage.total_limit_size 256M

