# Legacy project definition retained only to stop containers from older local setups.
# New and active local services are all defined in compose.yaml.
name: appchi-local-identity
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: [start-dev, --import-realm, --http-enabled=false, --hostname=https://localhost:58443, --https-certificate-file=/tls/localhost.pem, --https-certificate-key-file=/tls/localhost-key.pem, --truststore-paths=/tls/localhost.pem]
    ports:
      - "127.0.0.1:58443:8443"
    env_file: ../../.local/keycloak/bootstrap.env
    volumes:
      - ../../.local/keycloak/import:/opt/keycloak/data/import:ro
      - ../../.local/keycloak/tls:/tls:ro
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped
volumes:
  keycloak-data:
