services:
  postgres:
    image: postgres:18.2
    environment:
      POSTGRES_DB: appchi
      POSTGRES_USER: appchi_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["appchi_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appchi_migrator -d appchi"]
      interval: 3s
      timeout: 3s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:59200:9200"]
    volumes: ["appchi_es:/usr/share/elasticsearch/data"]
  redis:
    image: redis:7.4.2
    ports: ["127.0.0.1:56379:6379"]
  kafka:
    image: apache/kafka:4.0.0
    ports: ["127.0.0.1:${APPCHI_LOCAL_KAFKA_PORT:-59092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${APPCHI_LOCAL_KAFKA_PORT:-59092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
secrets:
  postgres_password:
    file: ../../.local/postgres-password.txt
volumes:
  appchi_pg:
  appchi_es:
