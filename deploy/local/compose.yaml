name: appchi-local-stack

# Local development dependencies. Appchi API/UI/worker processes run on the host;
# their ports stay loopback-only and use these published localhost bindings.
services:
  postgres:
    image: postgres:18.2
    # Reap orphaned exec/healthcheck children separately from the postmaster.
    init: true
    environment:
      POSTGRES_DB: appchi
      POSTGRES_USER: appchi_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["appchi_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appchi_migrator -d appchi"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:59201:9200"]
    volumes: ["appchi_es:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 60
    restart: unless-stopped

  redis:
    image: redis:7.4.2
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    ports: ["127.0.0.1:${APPCHI_LOCAL_KAFKA_PORT:-19093}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${APPCHI_LOCAL_KAFKA_PORT:-19093},INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The image default /tmp/kafka-logs lives in the container layer and is lost
      # when the container is recreated, while PostgreSQL keeps replay proof.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka_data:/var/lib/kafka/data"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command:
      - start-dev
      - --import-realm
      - --http-enabled=false
      - --hostname=https://localhost:58443
      - --https-certificate-file=/tls/localhost.pem
      - --https-certificate-key-file=/tls/localhost-key.pem
      - --truststore-paths=/tls/localhost.pem
    ports: ["127.0.0.1:58443:8443"]
    env_file: ../../.local/keycloak/bootstrap.env
    volumes:
      - ../../.local/keycloak/import:/opt/keycloak/data/import:ro
      - ../../.local/keycloak/tls:/tls:ro
      - ../../../appchi-frontend/keycloak/themes:/opt/keycloak/themes:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8443'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kong-db:
    image: postgres:16-alpine
    init: true
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD_FILE: /run/secrets/kong_password
    secrets: [kong_password]
    volumes: ["kong_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kong-migrations:
    image: kong:3.9.1
    depends_on:
      kong-db: {condition: service_healthy}
    env_file: ../../.local/operators/kong.env
    environment:
      KONG_PLUGINS: bundled,appchi-policy
    volumes:
      - ../../../appchi-ingestion/kong/appchi-policy:/usr/local/share/lua/5.1/kong/plugins/appchi-policy:ro
    command: ["sh", "-ec", "kong migrations bootstrap && kong migrations up && kong migrations finish"]
    restart: "no"

  kong:
    image: kong:3.9.1
    depends_on:
      kong-migrations: {condition: service_completed_successfully}
    env_file: ../../.local/operators/kong.env
    environment:
      KONG_PLUGINS: bundled,appchi-policy
      KONG_PROXY_LISTEN: "0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8444 ssl"
      KONG_SSL_CERT: /tls/server.crt
      KONG_SSL_CERT_KEY: /tls/server.key
      KONG_ADMIN_SSL_CERT: /tls/server.crt
      KONG_ADMIN_SSL_CERT_KEY: /tls/server.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /tls/ca.crt
      KONG_CLIENT_SSL: "on"
      KONG_CLIENT_SSL_CERT: /tls/kong.crt
      KONG_CLIENT_SSL_CERT_KEY: /tls/kong.key
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_LOG_LEVEL: warn
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_ADMIN_GUI_LISTEN: "off"
    ports: ["127.0.0.1:58445:8443", "127.0.0.1:${APPCHI_LOCAL_KONG_ADMIN_PORT:-58447}:8444"]
    volumes:
      - ../../.local/operators/tls/ca.crt:/tls/ca.crt:ro
      - ../../.local/operators/tls/server.crt:/tls/server.crt:ro
      - ../../.local/operators/tls/server.key:/tls/server.key:ro
      - ../../../appchi-ingestion/kong/appchi-policy:/usr/local/share/lua/5.1/kong/plugins/appchi-policy:ro
      - ../../.local/operators/tls/kong.crt:/tls/kong.crt:ro
      - ../../.local/operators/tls/kong.key:/tls/kong.key:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: local-bootstrap
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /tls/server.crt
      GF_SERVER_CERT_KEY: /tls/server.key
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
      SSL_CERT_FILE: /tls/ca.crt
    secrets: [grafana_password]
    ports: ["127.0.0.1:${APPCHI_LOCAL_GRAFANA_PORT:-58448}:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../.local/operators/tls/ca.crt:/tls/ca.crt:ro
      - ../../.local/operators/tls/server.crt:/tls/server.crt:ro
      - ../../.local/operators/tls/server.key:/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

secrets:
  postgres_password:
    file: ../../.local/postgres-password.txt
  kong_password:
    file: ../../.local/operators/kong-password.txt
  grafana_password:
    file: ../../.local/operators/grafana-password.txt

volumes:
  appchi_pg:
    name: appchi-local-runtime_appchi_pg
  appchi_es:
    name: appchi-local-runtime_appchi_es
  kafka_data:
    name: appchi-local-stack_kafka_data
  keycloak_data:
    name: appchi-local-identity_keycloak-data
  kong_data:
    name: appchi-local-operators_kong_data
  grafana_data:
    name: appchi-local-operators_grafana_data
