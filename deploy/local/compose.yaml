name: keep-local-stack

# Local development dependencies. Keep API/UI/worker processes run on the host;
# their ports stay loopback-only and use these published localhost bindings.
services:
  postgres:
    image: postgres:18.2
    # Reap orphaned exec/healthcheck children separately from the postmaster.
    init: true
    environment:
      POSTGRES_DB: keep
      POSTGRES_USER: keep_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["keep_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keep_migrator -d keep"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:59201:9200"]
    volumes: ["keep_es:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 60
    restart: unless-stopped

  redis:
    image: redis:7.4.2
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    ports: ["127.0.0.1:${KEEP_LOCAL_KAFKA_PORT:-19093}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KEEP_LOCAL_KAFKA_PORT:-19093},INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The image default /tmp/kafka-logs lives in the container layer and is lost
      # when the container is recreated, while PostgreSQL keeps replay proof.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka_data:/var/lib/kafka/data"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped

  # The isolated development directory. OpenLDAP generates an immutable entryUUID
  # per entry; both Authelia and Keep's own LDAP worker key principals by it, so dev
  # exercises the identical production directory code path. Seeded from an offline
  # LDIF; serves LDAPS on loopback 1636 for Keep's worker and plain LDAP on the
  # private Compose network for Authelia.
  openldap:
    image: bitnamilegacy/openldap:2.6.10@sha256:687f14a22b5c74fb057a57221acdbe7b8c82e2d3619fc380db3af48ec4aa04ed
    environment:
      LDAP_ROOT: dc=keep,dc=local
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/openldap_admin_password
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_PORT_NUMBER: "389"
      LDAP_LDAPS_PORT_NUMBER: "636"
      LDAP_ENABLE_TLS: "yes"
      LDAP_TLS_CERT_FILE: /tls/localhost.pem
      LDAP_TLS_KEY_FILE: /tls/localhost-key.pem
      LDAP_TLS_CA_FILE: /tls/localhost.pem
    secrets: [openldap_admin_password]
    # LDAPS is published on loopback for Keep's worker; plain 389 stays internal.
    ports: ["127.0.0.1:1636:636"]
    volumes:
      - ../../.local/identity/openldap/seed.ldif:/ldifs/seed.ldif:ro
      - ../../.local/identity/tls/localhost.pem:/tls/localhost.pem:ro
      - ../../.local/identity/tls/localhost-key.pem:/tls/localhost-key.pem:ro
      - openldap_data:/bitnami/openldap
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -H ldap://127.0.0.1:389 -x -b dc=keep,dc=local -s base >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Lightweight single-binary OIDC provider that authenticates against OpenLDAP and
  # emits the raw entryUUID verbatim in the dedicated keep-directory scope. HTTPS on
  # loopback 58443 under Keep's trusted localhost certificate; issuer is that URL.
  authelia:
    image: authelia/authelia:4.39.4@sha256:64b356c30fd817817a4baafb4dbc0f9f8702e46b49e1edb92ff42e19e487b517
    depends_on:
      openldap: {condition: service_healthy}
    command: ["--config", "/config/configuration.yml"]
    environment:
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /config/secrets/ldap_password
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage_encryption_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /config/secrets/oidc_hmac_secret
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/jwt_secret
    ports: ["127.0.0.1:58443:9091"]
    volumes:
      - ../../.local/identity/authelia/configuration.yml:/config/configuration.yml:ro
      - ../../.local/identity/authelia/secrets:/config/secrets:ro
      - ../../.local/identity/tls/localhost.pem:/config/tls/public.crt:ro
      - ../../.local/identity/tls/localhost-key.pem:/config/tls/private.key:ro
      - authelia_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9091'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kong-db:
    image: postgres:16-alpine
    init: true
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD_FILE: /run/secrets/kong_password
    secrets: [kong_password]
    volumes: ["kong_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kong-migrations:
    image: kong:3.9.1
    depends_on:
      kong-db: {condition: service_healthy}
    env_file: ../../.local/operators/kong.env
    environment:
      KONG_PLUGINS: bundled,keep-policy
    volumes:
      - ../../../keep-ingestion/kong/keep-policy:/usr/local/share/lua/5.1/kong/plugins/keep-policy:ro
    command: ["sh", "-ec", "kong migrations bootstrap && kong migrations up && kong migrations finish"]
    restart: "no"

  kong:
    image: kong:3.9.1
    depends_on:
      kong-migrations: {condition: service_completed_successfully}
    env_file: ../../.local/operators/kong.env
    environment:
      KONG_PLUGINS: bundled,keep-policy
      KONG_PROXY_LISTEN: "0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8444 ssl"
      KONG_SSL_CERT: /tls/server.crt
      KONG_SSL_CERT_KEY: /tls/server.key
      KONG_ADMIN_SSL_CERT: /tls/server.crt
      KONG_ADMIN_SSL_CERT_KEY: /tls/server.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /tls/ca.crt
      KONG_CLIENT_SSL: "on"
      KONG_CLIENT_SSL_CERT: /tls/kong.crt
      KONG_CLIENT_SSL_CERT_KEY: /tls/kong.key
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_LOG_LEVEL: warn
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_ADMIN_GUI_LISTEN: "off"
    ports: ["127.0.0.1:58445:8443", "127.0.0.1:${KEEP_LOCAL_KONG_ADMIN_PORT:-58447}:8444"]
    volumes:
      - ../../.local/operators/tls/ca.crt:/tls/ca.crt:ro
      - ../../.local/operators/tls/server.crt:/tls/server.crt:ro
      - ../../.local/operators/tls/server.key:/tls/server.key:ro
      - ../../../keep-ingestion/kong/keep-policy:/usr/local/share/lua/5.1/kong/plugins/keep-policy:ro
      - ../../.local/operators/tls/kong.crt:/tls/kong.crt:ro
      - ../../.local/operators/tls/kong.key:/tls/kong.key:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: local-bootstrap
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /tls/server.crt
      GF_SERVER_CERT_KEY: /tls/server.key
      # Grafana panels (REV-68): local viewers see dashboards without signing in, and
      # panels may be framed (the grafana-panels proxy limits framing to localhost).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
      SSL_CERT_FILE: /tls/ca.crt
    secrets: [grafana_password]
    ports: ["127.0.0.1:${KEEP_LOCAL_GRAFANA_PORT:-58448}:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../.local/operators/tls/ca.crt:/tls/ca.crt:ro
      - ../../.local/operators/tls/server.crt:/tls/server.crt:ro
      - ../../.local/operators/tls/server.key:/tls/server.key:ro
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/keep-local.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/keep-local.yaml:ro
      - ./grafana/dashboards:/var/lib/keep-dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Grafana under Keep's trusted localhost certificate, for Grafana panels (REV-68).
  grafana-panels:
    image: nginx:1.27.5-alpine
    depends_on: [grafana]
    ports: ["127.0.0.1:${KEEP_LOCAL_GRAFANA_PANEL_PORT:-58449}:8443"]
    volumes:
      - ./grafana/panels-proxy.conf:/etc/nginx/nginx.conf:ro
      - ../../.local/identity/tls/localhost.pem:/tls/localhost.pem:ro
      - ../../.local/identity/tls/localhost-key.pem:/tls/localhost-key.pem:ro
      - ../../.local/operators/tls/ca.crt:/tls/operators-ca.crt:ro
    restart: unless-stopped

secrets:
  postgres_password:
    file: ../../.local/postgres-password.txt
  openldap_admin_password:
    file: ../../.local/identity/openldap-admin-password.txt
  kong_password:
    file: ../../.local/operators/kong-password.txt
  grafana_password:
    file: ../../.local/operators/grafana-password.txt

volumes:
  keep_pg:
    name: keep-local-runtime_keep_pg
  keep_es:
    name: keep-local-runtime_keep_es
  kafka_data:
    name: keep-local-stack_kafka_data
  openldap_data:
    name: keep-local-identity_openldap_data
  authelia_data:
    name: keep-local-identity_authelia_data
  kong_data:
    name: keep-local-operators_kong_data
  grafana_data:
    name: keep-local-operators_grafana_data
