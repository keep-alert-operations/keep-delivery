# Synthetic data for the local Grafana panels dashboard (REV-68); no external source.
apiVersion: 1
datasources:
  - name: Keep local test data
    uid: keep-local-testdata
    type: grafana-testdata-datasource
    access: proxy
    editable: false
  # Keep's own metrics from the stack's Prometheus (REV-74).
  - name: Keep metrics
    uid: keep-local-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
