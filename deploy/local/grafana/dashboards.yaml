# The local Grafana panels dashboard (REV-68), read-only in Grafana.
apiVersion: 1
providers:
  - name: keep-local
    folder: Keep local
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/keep-dashboards
  # The Keep monitoring dashboards (REV-74), the same files delivered for company Grafana.
  - name: keep-monitoring
    folder: Keep monitoring
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/keep-monitoring-dashboards
