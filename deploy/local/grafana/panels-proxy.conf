# Local Grafana for Keep's Grafana panels (REV-68).
#
# Browsers trust Keep's local localhost certificate but not the operators CA that signs
# Grafana's own certificate, so a framed Grafana panel would fail its TLS check. This
# proxy serves Grafana under Keep's localhost certificate and verifies Grafana itself
# with the operators CA. Only pages on localhost (any port) may frame it.
events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8443 ssl;
    ssl_certificate /tls/localhost.pem;
    ssl_certificate_key /tls/localhost-key.pem;

    location / {
      proxy_pass https://grafana:3000;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /tls/operators-ca.crt;
      proxy_ssl_name grafana;
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header Content-Security-Policy "frame-ancestors 'self' https://localhost:*" always;
    }
  }
}
